<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Colonia · reportar una falla</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F766E}a:hover{color:#115E59}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F0FDFA; font-family: Inter, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
<div style="padding: 20px; background: #0F766E; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #CCFBF1; font-weight: 600">Residencial Los Pinos</span>
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 24px">Portón principal</span>
<span style="font-size: 13px; color: #CCFBF1">Último mantenimiento: 2 oct · Portones Seguros</span>
</div>

<form style="padding: 20px; display: flex; flex-direction: column; gap: 16px; flex: 1">
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 16px; font-weight: 700; margin-bottom: 10px">¿Qué pasa?</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{opciones}}" as="o" hint-placeholder-count="4">
<label style="{{o.estilo}}"><input type="radio" name="falla" style="accent-color: #0F766E"> {{o.t}}</label>
</sc-for>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nota" style="font-size: 14px; font-weight: 600">Contanos más (opcional)</label>
<textarea id="nota" rows="3" style="border: 1px solid #99F6E4; border-radius: 10px; padding: 10px; font: inherit; font-size: 14px; resize: none">Se queda a medio cerrar desde anoche.</textarea>
</div>

<button type="button" style="min-height: 48px; border-radius: 10px; border: 1.5px dashed #14B8A6; background: #FFFFFF; color: #115E59; font: inherit; font-size: 14px; font-weight: 600">Agregar foto</button>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="casa" style="font-size: 14px; font-weight: 600">Tu casa</label>
<input id="casa" value="14-B" style="min-height: 44px; border: 1px solid #99F6E4; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px">
</div>

<button type="button" style="min-height: 52px; border-radius: 12px; border: none; background: #0F766E; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">Enviar reporte</button>

<div style="margin-top: auto; background: #FFFFFF; border: 1px solid #99F6E4; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700">Ya reportado aquí</span>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px">
<span>No cierra · casa 9-A</span>
<span style="font-size: 12px; font-weight: 600; background: #FEF3C7; color: #854D0E; border-radius: 6px; padding: 3px 8px">Proveedor en camino</span>
</div>
</div>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const opciones = ['No abre', 'No cierra', 'Hace ruido', 'Otro'].map((t, i) => ({ t: t,
      estilo: 'min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 600; background: #FFFFFF; border: ' + (i === 1 ? '2px solid #0F766E' : '1px solid #99F6E4') }));
    return { opciones: opciones };
  }
}
</script>
</body>
</html>
